<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
            content="width=device-width, initial-scale=1.0">
        <title>Paragraphs exercise</title>
    </head>
    <body>
        <h1>Paragraphs</h1>
        <hr>
        <p>
            You can write whatever you want the way
            you want!
            It
            just
            need
            to
            be
            inside
            the
            &ltp&gt and &lt/p&gt pair tags.
        </p>

            <!--isso aqui eh um comentario-->

            <br> <br>
        <p>
            You can also use special symbols, such as &reg; &copy; &trade;, etc.
        </p>
        <br><br>
        <hr>
        <p>
            You can also add emojis:
            <br>
            &#x1F987;
            <br>
            &#128507;
            <br>
            &#128511;
            <br><br>
            And also make them big:
            <br>
            <h1>
                &#x1F987;
            </h1>
        </p>
    </body>
</html>
